<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXY PRO | Quick Recharge</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', 'Cairo', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
            z-index: -1;
        }
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            opacity: 0.4;
            filter: blur(100px);
            z-index: -1;
        }

        .recharge-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 50px;
            width: 550px;
            max-width: 95%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 40px;
        }

        .phone-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px 30px;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-align: center;
            letter-spacing: 5px;
            transition: all 0.3s;
            outline: none;
        }

        .phone-input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        .input-label {
            position: absolute;
            top: -12px;
            right: 30px;
            background: #1e1b4b;
            padding: 2px 12px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            border-radius: 8px;
            text-transform: uppercase;
        }

        .service-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn-service {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-service i {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .btn-service:hover {
            background: var(--primary);
            color: #020617;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 210, 255, 0.3);
        }

        .btn-service:hover i { color: #020617; }

        .btn-full {
            grid-column: span 2;
            background: linear-gradient(to right, #3b82f6, #06b6d4);
            border: none;
            color: white;
            font-size: 1.3rem;
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-full:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4);
        }

        /* Offers Panel */
        #offers-panel {
            margin-top: 30px;
            display: none;
            text-align: right;
            max-height: 300px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
        }

        .offer-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .offer-item:hover {
            background: var(--glass);
            border-color: var(--primary);
        }

        .amount-badge {
            background: var(--primary);
            color: #000;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        /* Status Overlay */
        #status-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 30px;
            border-radius: 15px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }

        .loading-spinner {
            display: none;
            margin: 20px 0;
            color: var(--primary);
        }

        .operator-tag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .tag-mobilis { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .tag-ooredoo { background: rgba(255, 0, 85, 0.1); color: #ff0055; }
        .tag-djezzy { background: rgba(255, 179, 0, 0.1); color: #ffb300; }

    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-mesh"></div>

    <div id="status-overlay">
        <div class="status-dot"></div>
        <span>نظام الشحن متصل</span>
    </div>

    <div class="recharge-card">
        <div class="logo">FLEXY PRO MAX</div>
        
        <div id="operator-badge" class="operator-tag" style="display: none;"></div>

        <div class="input-group">
            <span class="input-label">رقم الهاتف</span>
            <input type="text" id="phone" class="phone-input" placeholder="06XXXXXXXX" maxlength="10">
        </div>

        <div class="service-grid">
            <button class="btn-service" onclick="handleOffers()">
                <i class="fas fa-tags"></i>
                <span>عروض مفعل</span>
            </button>
            <button class="btn-service" onclick="handleInvoice()">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>فاتورة</span>
            </button>
            <button class="btn-full" onclick="handleInternational()">
                <i class="fas fa-globe-africa"></i>
                <span>الو انترناسيونال</span>
            </button>
        </div>

        <div class="loading-spinner" id="loader">
            <i class="fas fa-circle-notch fa-spin fa-3x"></i>
            <div style="margin-top: 15px; font-weight: 600;">جاري معالجة الطلب...</div>
        </div>

        <div id="offers-panel">
            <div style="font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">العروض المتاحة للرقم:</div>
            <div id="offers-list"></div>
        </div>
    </div>

    <script>
        const phoneInput = document.getElementById('phone');
        const badge = document.getElementById('operator-badge');

        phoneInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.startsWith('06')) {
                badge.innerText = 'Mobilis';
                badge.className = 'operator-tag tag-mobilis';
                badge.style.display = 'inline-block';
            } else if (val.startsWith('05')) {
                badge.innerText = 'Ooredoo';
                badge.className = 'operator-tag tag-ooredoo';
                badge.style.display = 'inline-block';
            } else if (val.startsWith('07')) {
                badge.innerText = 'Djezzy';
                badge.className = 'operator-tag tag-djezzy';
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        });

        async function apiCall(endpoint, data) {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await res.json();
            } catch (e) {
                alert('خطأ في الاتصال: ' + e.message);
                return null;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function handleOffers() {
            const phone = phoneInput.value;
            if (phone.length < 10) return alert('يرجى إدخال رقم صحيح');
            
            const panel = document.getElementById('offers-panel');
            const list = document.getElementById('offers-list');
            panel.style.display = 'none';
            list.innerHTML = '';

            const data = await apiCall('/api/sama/offers', { phone });
            if (data && data.success) {
                panel.style.display = 'block';
                const lines = data.content.split('\n');
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.length < 3) return;
                    
                    const item = document.createElement('div');
                    item.className = 'offer-item';
                    const amountMatch = trimmed.match(/(\d{2,4})/);
                    const amount = amountMatch ? amountMatch[0] : '---';
                    
                    item.innerHTML = `
                        <span>${trimmed}</span>
                        <span class="amount-badge">${amount} DA</span>
                    `;
                    item.onclick = () => {
                        if (confirm(`هل تريد تفعيل هذا العرض بقيمة ${amount} DA؟`)) {
                            submitFlexy(phone, amount);
                        }
                    };
                    list.appendChild(item);
                });
            } else {
                alert('فشل جلب العروض: ' + (data?.error || 'المودم غير متوفر'));
            }
        }

        async function handleInvoice() {
            const phone = phoneInput.value;
            if (phone.length < 10) return alert('يرجى إدخال رقم صحيح');
            const amount = prompt('أدخل قيمة الفاتورة (DA):');
            if (!amount) return;

            const data = await apiCall('/api/flexy/invoice', { phone, amount });
            if (data && data.success) alert('تم إرسال طلب دفع الفاتورة بنجاح');
            else alert('فشل الطلب: ' + (data?.error || 'خطأ غير معروف'));
        }

        async function handleInternational() {
            const phone = phoneInput.value;
            if (phone.length < 10) return alert('يرجى إدخال رقم صحيح');
            const amount = prompt('أدخل القيمة المراد شحنها (Alo International):');
            if (!amount) return;

            const data = await apiCall('/api/flexy/international', { phone, amount });
            if (data && data.success) alert('تم إرسال طلب Alo International بنجاح');
            else alert('فشل الطلب: ' + (data?.error || 'خطأ غير معروف'));
        }

        async function submitFlexy(phone, amount) {
            const data = await apiCall('/api/portal/flexy', { phone, amount });
            if (data && data.success) alert('تم شحن العرض بنجاح');
            else alert('فشل الشحن: ' + (data?.error || 'خطأ غير معروف'));
        }
    </script>
</body>
</html>
