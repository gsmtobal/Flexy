    <meta http-equiv="refresh" content="0; url=index.html">
    <script>window.location.href = "index.html";</script>
</head>
<body class="dark-mode">
    <header>
        <h1><i class="fas fa-server"></i> Server Overview</h1>
        <div class="status-badge"><span class="dot pulse"></span> RUNNING</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon purple"><i class="fas fa-wallet"></i></div>
            <div class="stat-info">
                <h3>Total Sales</h3>
                <p id="total-balance">0 DA</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-microchip"></i></div>
            <div class="stat-info">
                <h3>CPU Usage</h3>
                <p>2.4%</p>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>Server Performance</h3>
        <p style="color: var(--text-secondary); margin-top: 10px;">All systems operational. Listening on port 5000.</p>
    </div>

    <script>
        async function update() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('total-balance').innerText = `${data.totalBalance} DA`;
        }
        setInterval(update, 3000);
        update();
    </script>
</body>
</html>
